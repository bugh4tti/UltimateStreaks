# Configuración general de UltimateStreaks

settings:
  max-streak-days: 50
  streak-reset-hours: 24 # Horas que deben pasar para poder reclamar de nuevo

messages:
  prefix: "&8[&b&lStreaks&8] &r"
  no-permission: "&cNo tenés permiso para hacer esto."
  reload-success: "&aConfiguración recargada correctamente."
  claim-success: "&aReclamaste la racha del día &e{day}&a!"
  already-claimed: "&cYa reclamaste tu racha de hoy. Volvé en &e{time}&c."
  day-locked: "&cTodavía no llegaste a este día de racha."
  invalid-day: "&cEl día de racha ingresado no es válido."
  give-success: "&aLe diste la racha del día &e{day}&a a &e{player}&a."
  give-received: "&aRecibiste la racha del día &e{day}&a."

gui:
  title: "&8&lRachas &7- &ePágina {page}"
  size: 54
  next-page-item:
    material: ARROW
    name: "&a&lSiguiente Página"
    slot: 53
  previous-page-item:
    material: ARROW
    name: "&c&lPágina Anterior"
    slot: 45
  locked-item:
    material: GRAY_DYE
    name: "&c&lBloqueado"
    lore:
      - "&7Todavía no llegaste a este día."
      - "&7Seguí reclamando tu racha diaria."
  unlocked-item:
    material: LIME_DYE
    name: "&a&lDesbloqueado"
    lore:
      - "&7¡Ya podés reclamar esta racha!"
      - "&aClickeá para reclamar"
  claimed-item:
    material: GRAY_DYE
    name: "&8&lReclamado"
    lore:
      - "&7Ya reclamaste esta racha."

