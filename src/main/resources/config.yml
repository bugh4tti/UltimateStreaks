# ============================================================
#  UltimateStreaks - config.yml
#  Colores: &a, &l, hex &#RRGGBB y &x&R&R&G&G&B&B
# ============================================================

settings:
  max-streak-days: 50
  streak-reset-hours: 24 # Horas entre reclamos. Si pasa el doble, la racha vuelve al día 1

messages:
  prefix: "&8[&b&lStreaks&8] &r"
  no-permission: "&cNo tenés permiso para hacer esto."
  reload-success: "&aConfiguración recargada correctamente."
  claim-success: "&aReclamaste la racha del día &e{day}&a!"
  already-claimed: "&cYa reclamaste tu racha de hoy. Volvé en &e{time}&c."
  day-claimed: "&cYa reclamaste el día &e{day}&c."
  day-locked: "&cTodavía no llegaste a este día de racha."
  time-available: "&aDisponible ahora"
  invalid-day: "&cEl día de racha ingresado no es válido."
  give-success: "&aLe diste la racha del día &e{day}&a a &e{player}&a."
  give-received: "&aRecibiste la racha del día &e{day}&a."

gui:
  # {page} = página actual | {pages} = total de páginas
  title: "&0&nMenú de Rachas ({page}/{pages})"

  layout:
    # Slots (0-53) de los días, EN ORDEN (camino en serpiente, 21 por página)
    day-slots: [9, 10, 19, 28, 37, 38, 39, 30, 21, 12, 13, 14, 23, 32, 41, 42, 43, 34, 25, 16, 17]
    # Slots de los botones de página (hasta 6)
    page-button-slots: [1, 2, 3, 5, 6, 7]
    progress-slot: 49

  filler-item:
    material: GRAY_STAINED_GLASS_PANE
    name: " "

  # Placeholders: {page} {pages} {from} {to}
  page-button:
    material: PAPER # Se usa si la página no tiene textura (muestra el número de página)
    name: "&#5DA5BF&lPÁGINA &fNúmero #{page}"
    lore:
      - "&7「 Botón 」"
      - ""
      - "&fVisualiza desde el Día {from}"
      - "&fhasta el Día {to} de la Racha."
      - ""
      - "&#5DA5BF☀ ¡Click para ir a esta página!"
    # Opcional: URL de textura (minecraft-heads.com -> "Minecraft-URL") para cabezas con número
    texture-urls:
      "1": ""
      "2": ""
      "3": ""
      "4": ""
      "5": ""
      "6": ""

  previous-page-item:
    material: ARROW
    name: "&c&lPágina Anterior"
    lore:
      - "&7「 Botón 」"
      - ""
      - "&c☀ ¡Click para volver!"
    slot: 48

  next-page-item:
    material: ARROW
    name: "&a&lSiguiente Página"
    lore:
      - "&7「 Botón 」"
      - ""
      - "&a☀ ¡Click para avanzar!"
    slot: 50

  # Placeholders: {current} {claimed} {remaining} {max} {time}
  progress-item:
    name: "&e&lMi Progreso"
    lore:
      - "&7「 Botón 」"
      - ""
      - "&e&l| &eInfo de Racha:"
      - "&a◎ &fDía actual: &e{current}&7/&e{max}"
      - ""
      - "&a&l| &aEstadísticas:"
      - "&a✔ &fReclamados: &a{claimed}"
      - "&b⌛ &fPróximo reclamo: &b{time}"
      - "&e✦ &fDías restantes: &e{remaining}"

  # Placeholders: {day} {current} {max}
  # {rewards} se reemplaza por "rewards-lore" del día y {status} por el "footer" del estado
  day-item:
    name: "&6&lRACHA &fDía &f[&d{day}&f]"
    lore:
      - "&7「 Botón 」"
      - ""
      - "&e&l| &eRequisitos:"
      - "&b⌛ &fLlegar al &b&lDÍA {day} &7(Vas por el día {current})"
      - ""
      - "&a&l| &aRecompensas:"
      - "{rewards}"
      - ""
      - "{status}"

  states:
    locked:
      material: GRAY_DYE
      footer:
        - "&c✖ &c&lBLOQUEADO"
    unlocked:
      material: LIME_DYE
      footer:
        - "&a✔ &a&lDESBLOQUEADO"
        - "&6☀ ¡Click para reclamar!"
    claimed:
      material: GREEN_DYE
      footer:
        - "&7✔ &7&lRECLAMADO"

